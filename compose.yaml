services:
  # ==========================================
  # 1. BASE DE DATOS Y ADMINISTRACIÓN
  # ==========================================
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Completa el archivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Completa el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completa el archivo .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    networks:
      - redtpfinal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.19
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Completa el archivo .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Completa el archivo .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - redtpfinal
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # 2. SISTEMA DE MONITOREO
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - node-exporter
      - cadvisor
      - postgres-exporter
    networks:
      - redtpfinal

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - redtpfinal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - redtpfinal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - redtpfinal

  # ==========================================
  # 3. NEXTCLOUD
  # ==========================================
  nextcloud-db:
    image: postgres:17
    shm_size: 2gb
    environment:
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
    volumes:
      - db-nextcloud:/var/lib/postgresql/data
    networks:
      - redtpfinal

  nextcloud:
    image: nextcloud:latest
    ports:
      - 8082:80
    depends_on:
      - nextcloud-db
    environment:
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - POSTGRES_DB=${NEXTCLOUD_DB_NAME}
      - POSTGRES_USER=${NEXTCLOUD_DB_USER}
      - POSTGRES_HOST=${NEXTCLOUD_DB_HOST}
    volumes:
      - nextcloud:/var/www/html
    networks:
      - redtpfinal

volumes:
  postgres18_data:
  pgadmin_data:
  prometheus_data:
  nextcloud:
  db-nextcloud:

networks:
  redtpfinal: