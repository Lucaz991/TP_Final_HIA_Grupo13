# Basado en frontend/nginx.conf; CSP local y bloqueo de integraciones solo para H24.
server {
    listen 80;
    server_name localhost;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-H24-Environment "isolated-test" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El 503 confirma la desactivacion del laboratorio, no seguridad del proveedor.
    location ~* ^/api/chat(/|$) {
        default_type application/json;
        return 503 '{"status":0,"msg":"H24: integracion externa deshabilitada"}';
    }
    location ~* ^/api/autenticacion/(loginGoogle|signUpGoogle)/?$ {
        default_type application/json;
        return 503 '{"status":0,"msg":"H24: usar las cuentas locales de prueba"}';
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
