global
    maxconn 1000

defaults
    log global
    mode tcp
    retries 3
    timeout client 30m
    timeout connect 4s
    timeout server 30m

frontend pg_frontend
    bind *:5432
    bind *:5465
    default_backend pg_cluster_backend

backend pg_cluster_backend
    option httpchk GET /master
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server node1 node1:5432 maxconn 100 check port 8000
    server node2 node2:5432 maxconn 100 check port 8000
    server node3 node3:5432 maxconn 100 check port 8000

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /stats
    stats refresh 5s
