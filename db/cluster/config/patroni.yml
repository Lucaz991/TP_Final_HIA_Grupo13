scope: postgres-cluster
namespace: /service
name: ${PATRONI_NAME}

etcd3:
  hosts: etcd:2379

restapi:
  listen: 0.0.0.0:8000
  connect_address: ${PATRONI_NAME}:8000

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        max_connections: 500
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 512MB
  post_init: /usr/local/bin/init-cluster.sh
  pg_hba:
    - host replication replicacion 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5

postgresql:
  listen: 0.0.0.0:5432
  connect_address: ${PATRONI_NAME}:5432
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/16/bin
  authentication:
    replication:
      username: ${DB_REPL_USER}
      password: ${DB_REPL_PASSWORD}
    superuser:
      username: ${DB_ADMIN_USER}
      password: ${DB_ADMIN_PASSWORD}

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
