global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Reglas de alertas
rule_files:
  - "/etc/prometheus/alerts.yml"

# Envío de alertas
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Recolección de metricas
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'postgres-cluster-nodes'
    static_configs:
      - targets: ['postgres-exporter-node1:9187']
        labels:
          node: 'node1'
          role: 'cluster-member'
      - targets: ['postgres-exporter-node2:9187']
        labels:
          node: 'node2'
          role: 'cluster-member'
      - targets: ['postgres-exporter-node3:9187']
        labels:
          node: 'node3'
          role: 'cluster-member'