server {
    listen 80;
    server_name localhost;

    # Ocultar version de nginx (fingerprinting - ZAP)
    server_tokens off;

    # Headers de seguridad (remediacion hallazgos ZAP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com https://cdn.datatables.net; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Angular routing: todo cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API → backend container
    location /api/ {
        proxy_pass http://app-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}