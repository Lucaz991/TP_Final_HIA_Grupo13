route:
  receiver: n8n-webhook
  group_by:
    - alertname
    - instance
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: n8n-webhook
    webhook_configs:
      - url: 'http://n8n:5678/webhook/prometheus-alert'
        send_resolved: true
        max_alerts: 0
        http_config:
          basic_auth:
            username: '${N8N_WEBHOOK_ALERTS_USER}'
            password: '${N8N_WEBHOOK_ALERTS_PASS}'